<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14212B">
<title>Capture</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --base:    #14212B;
    --surface: #1C2E3A;
    --line:    #2C4454;
    --text:    #E8EEF2;
    --muted:   #8CA5B5;
    --signal:  #E9A23B;
    --good:    #7FD8C4;
    --bad:     #E8836F;
    --radius:  14px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; height: 100%;
    background: var(--base);
    color: var(--text);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-weight: 400;
    overscroll-behavior: none;
  }

  body {
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 20px calc(env(safe-area-inset-bottom) + 20px);
    max-width: 640px; margin: 0 auto;
  }

  /* ---------- status ---------- */
  header {
    padding: 18px 2px 10px;
    display: flex; align-items: baseline; justify-content: space-between;
    border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  #clock { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #gear {
    background: none; border: none; padding: 0 0 0 12px; flex: none;
    color: var(--muted); font-size: 13px; font-weight: 400; width: auto;
  }

  /* ---------- transcript ---------- */
  main { flex: 1; overflow-y: auto; padding: 22px 2px; }

  #transcript {
    width: 100%; border: none; background: none; resize: none;
    color: var(--text); font: inherit;
    font-size: 22px; font-weight: 300; line-height: 1.45;
    letter-spacing: -0.01em;
    min-height: 110px; max-height: 340px; outline: none;
  }
  #transcript::placeholder { color: var(--muted); opacity: .55; }

  #hint {
    color: var(--muted); font-size: 14px; line-height: 1.5;
    margin-top: 18px; max-width: 40ch;
  }

  /* ---------- proposal cards ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px; margin-top: 14px;
  }
  .card h2 {
    font-size: 15px; font-weight: 600; margin: 0 0 12px;
    display: flex; align-items: center; gap: 9px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--signal); flex: none; }
  .card dl { margin: 0; display: grid; grid-template-columns: 88px 1fr; gap: 7px 14px; }
  .card dt { color: var(--muted); font-size: 13px; }
  .card dd { margin: 0; font-size: 14.5px; line-height: 1.4; word-break: break-word; }

  .note { color: var(--muted); font-size: 14px; margin-top: 16px; line-height: 1.5; }
  .error { color: var(--bad); font-size: 14.5px; margin-top: 16px; line-height: 1.5; }

  .result { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; font-size: 15px; }
  .result a { color: var(--good); text-decoration: none; border-bottom: 1px solid rgba(127,216,196,.35); }
  .tick { color: var(--good); flex: none; }
  .cross { color: var(--bad); flex: none; }

  /* ---------- controls ---------- */
  footer { padding-top: 14px; }

  .row { display: flex; gap: 12px; }

  button {
    font: inherit; font-size: 16px; font-weight: 500;
    border-radius: var(--radius); border: 1px solid var(--line);
    background: var(--surface); color: var(--text);
    padding: 15px 18px; cursor: pointer; flex: 1;
    transition: opacity .15s ease;
  }
  button:active { opacity: .7; }
  button:disabled { opacity: .35; cursor: default; }
  button:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
  .primary { background: var(--signal); border-color: var(--signal); color: #14212B; font-weight: 600; }

  /* ---------- mic ---------- */
  #mic {
    width: 100%; height: 84px; flex: none;
    display: flex; align-items: center; justify-content: center; gap: 13px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 42px; font-size: 17px; font-weight: 500;
  }
  #mic .ring {
    width: 15px; height: 15px; border-radius: 50%;
    background: var(--signal); flex: none;
  }
  #mic.listening { border-color: var(--signal); }
  #mic.listening .ring { animation: pulse 1.35s ease-out infinite; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(233,162,59,.55); }
    70%  { box-shadow: 0 0 0 17px rgba(233,162,59,0); }
    100% { box-shadow: 0 0 0 0 rgba(233,162,59,0); }
  }
  @media (prefers-reduced-motion: reduce) {
    #mic.listening .ring { animation: none; box-shadow: 0 0 0 6px rgba(233,162,59,.3); }
  }

  /* ---------- setup ---------- */
  #setup { padding: 30px 2px; }
  #setup p { color: var(--muted); font-size: 15px; line-height: 1.55; max-width: 42ch; }
  #setup input {
    width: 100%; margin: 8px 0 16px; padding: 14px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); color: var(--text); font: inherit; font-size: 16px;
  }
  #setup label { font-size: 14px; color: var(--muted); }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>Capture</h1>
  <span><span id="clock"></span> <button id="gear" title="Connection settings" aria-label="Connection settings">Settings</button></span>
</header>

<main>
  <div id="setup" class="hidden">
    <p>Connect this device to your Worker. Both values are stored on this phone only.</p>
    <label for="url">Worker address</label>
    <input id="url" type="url" inputmode="url" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="https://mcj-voice-capture.workers.dev">
    <label for="token">Access token</label>
    <input id="token" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="The APP_TOKEN you set">
    <p id="setupWarn" class="error" style="margin:0 0 14px"></p>
    <button class="primary" id="saveSetup">Save and continue</button>
  </div>

  <div id="work">
    <textarea id="transcript" rows="3" placeholder="Tap the microphone and say what you need." aria-label="What you said"></textarea>
    <p id="hint">Say something like: book Rian a tennis lesson Friday half five at Glen Iris, court eight, invite Chaturi — and remind me to pay the coach.</p>
    <div id="output"></div>
  </div>
</main>

<footer>
  <button id="mic"><span class="ring"></span><span id="micLabel">Hold a thought</span></button>
  <div class="row hidden" id="actions" style="margin-top:12px">
    <button id="discard">Discard</button>
    <button id="confirm" class="primary">Create</button>
  </div>
</footer>

<script>
(function () {
  "use strict";

  var S = {
    url:   localStorage.getItem("vc_url") || "",
    token: localStorage.getItem("vc_token") || "",
    actions: null,
    listening: false
  };

  var el = function (id) { return document.getElementById(id); };
  var mic = el("mic"), micLabel = el("micLabel"), transcript = el("transcript"),
      output = el("output"), hint = el("hint"), actionRow = el("actions");

  /* ---------- clock ---------- */
  function tick() {
    el("clock").textContent = new Date().toLocaleString("en-AU", {
      weekday: "short", day: "numeric", month: "short",
      hour: "numeric", minute: "2-digit"
    });
  }
  tick(); setInterval(tick, 20000);

  /* ---------- setup gate ---------- */
  function checkSetup() {
    var ready = S.url && S.token;
    el("setup").classList.toggle("hidden", ready);
    el("work").classList.toggle("hidden", !ready);
    mic.classList.toggle("hidden", !ready);
    return ready;
  }
  el("url").value = S.url;
  el("token").value = S.token;
  el("saveSetup").addEventListener("click", function () {
    // Strip every kind of whitespace — mobile keyboards love a trailing space.
    var url = el("url").value.replace(/\s/g, "").replace(/\/+$/, "");
    var token = el("token").value.replace(/\s/g, "");
    var warn = el("setupWarn");

    if (!url || !token) {
      warn.textContent = "Both fields are needed.";
      return;
    }
    if (!/^https:\/\//.test(url)) {
      warn.textContent = "The Worker address must start with https://";
      return;
    }
    warn.textContent = "";
    S.url = url; S.token = token;
    localStorage.setItem("vc_url", url);
    localStorage.setItem("vc_token", token);
    el("url").value = url; el("token").value = token;
    checkSetup();
  });

  el("gear").addEventListener("click", function () {
    el("setup").classList.remove("hidden");
    el("work").classList.add("hidden");
    mic.classList.add("hidden");
    el("setupWarn").textContent = "";
  });

  checkSetup();

  /* ---------- speech ---------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recog = null;

  // How long a pause is allowed before capture ends on its own.
  var SILENCE_LIMIT = 15000;
  var wantListening = false;
  var lastHeard = 0;
  var countdownTimer = null;

  // The box grows with the text so nothing is hidden below the fold.
  function grow() {
    transcript.style.height = "auto";
    transcript.style.height = Math.min(transcript.scrollHeight, 340) + "px";
  }
  transcript.addEventListener("input", grow);

  if (!SR) {
    micLabel.textContent = "Type instead";
    mic.querySelector(".ring").style.background = "var(--muted)";
  } else {
    recog = new SR();
    recog.lang = "en-AU";
    recog.continuous = true;

    // Android Chrome keeps every growing partial as its own result entry, so
    // asking for interim results there produces "create / create a / create a
    // reminder" stacked on top of each other. Finals only on Android; desktop
    // keeps the live preview.
    var isAndroid = /Android/i.test(navigator.userAgent);
    recog.interimResults = !isAndroid;

    var prefix = "";
    var finals = "";
    var seen = 0;

    recog.addEventListener("start", function () {
      S.listening = true;
      // Everything captured so far becomes the prefix, so restarting after a
      // pause appends rather than replaces.
      prefix = transcript.value ? transcript.value.trim() + " " : "";
      finals = "";
      seen = 0;
      mic.classList.add("listening");
      clearOutput();
    });

    recog.addEventListener("result", function (e) {
      // Never re-read an index already folded in, even if it is re-delivered.
      var start = Math.max(e.resultIndex, seen);
      var interim = "";

      for (var i = start; i < e.results.length; i++) {
        var chunk = e.results[i][0].transcript;
        if (e.results[i].isFinal) {
          finals += chunk + " ";
          seen = i + 1;
        } else {
          interim += chunk;
        }
      }

      lastHeard = Date.now();
      transcript.value = (prefix + finals + interim).replace(/\s+/g, " ").trimStart();
      grow();
    });

    recog.addEventListener("error", function (e) {
      if (e.error === "not-allowed") {
        wantListening = false;
        stopListening();
        showError("Microphone access is blocked. Allow it for this site in Chrome's site settings.");
      } else if (e.error === "no-speech" || e.error === "aborted") {
        // Normal on a pause — the end handler decides whether to resume.
      } else {
        wantListening = false;
        stopListening();
        showError("Speech input stopped: " + e.error + ". Type your note instead.");
      }
    });

    // Android ends the session on every pause. Resume until either the user
    // taps stop or SILENCE_LIMIT passes with nothing new being said.
    recog.addEventListener("end", function () {
      if (!wantListening) { stopListening(); return; }

      if (Date.now() - lastHeard > SILENCE_LIMIT) {
        wantListening = false;
        stopListening();
        return;
      }

      try {
        recog.start();
      } catch (err) {
        // Restarting too fast — back off briefly, then try once more.
        setTimeout(function () {
          if (!wantListening) return;
          try { recog.start(); } catch (e2) { wantListening = false; stopListening(); }
        }, 300);
      }
    });
  }

  function stopListening() {
    S.listening = false;
    clearInterval(countdownTimer);
    countdownTimer = null;
    mic.classList.remove("listening");
    micLabel.textContent = "Hold a thought";
  }

  function startListening() {
    wantListening = true;
    lastHeard = Date.now();
    clearInterval(countdownTimer);
    countdownTimer = setInterval(function () {
      if (!wantListening) return;
      var quiet = Math.round((Date.now() - lastHeard) / 1000);
      var left = Math.ceil((SILENCE_LIMIT - (Date.now() - lastHeard)) / 1000);
      // Only nag once the pause is long enough to be worth mentioning.
      micLabel.textContent =
        quiet >= 5 ? "Still listening — " + Math.max(left, 0) + "s"
                   : "Listening — tap to finish";
      if (Date.now() - lastHeard > SILENCE_LIMIT) {
        wantListening = false;
        try { recog.stop(); } catch (e) { stopListening(); }
      }
    }, 500);

    try { recog.start(); } catch (err) { /* already running */ }
  }

  mic.addEventListener("click", function () {
    if (!recog) { interpret(); return; }
    if (S.listening || wantListening) {
      wantListening = false;
      micLabel.textContent = "Reading it back";
      try { recog.stop(); } catch (e) {}
      setTimeout(interpret, 300);
    } else {
      startListening();
    }
  });

  /* ---------- output ---------- */
  function clearOutput() { output.innerHTML = ""; S.actions = null; actionRow.classList.add("hidden"); }
  function showError(msg) { output.innerHTML = '<p class="error"></p>'; output.querySelector(".error").textContent = msg; }

  var LABELS = {
    create_calendar_event: "Calendar event",
    create_clickup_task: "ClickUp task"
  };
  var FIELDS = {
    title: "Title", name: "Task", start: "Starts", end: "Ends",
    location: "Where", attendees: "Invite", description: "Notes",
    due_date: "Due", priority: "Priority", tags: "Tags", all_day: "All day"
  };

  function pretty(key, value) {
    if (Array.isArray(value)) return value.join(", ");
    if (typeof value === "boolean") return value ? "Yes" : "No";
    if ((key === "start" || key === "end" || key === "due_date") && /\d{4}-\d{2}-\d{2}T/.test(value)) {
      return new Date(value).toLocaleString("en-AU", {
        weekday: "short", day: "numeric", month: "short",
        hour: "numeric", minute: "2-digit"
      });
    }
    return String(value);
  }

  function renderProposal(actions, reply) {
    output.innerHTML = "";
    actions.forEach(function (a) {
      var card = document.createElement("div");
      card.className = "card";

      var h = document.createElement("h2");
      h.innerHTML = '<span class="dot"></span>';
      h.appendChild(document.createTextNode(LABELS[a.tool] || a.tool));
      card.appendChild(h);

      var dl = document.createElement("dl");
      Object.keys(a.input).forEach(function (k) {
        var v = a.input[k];
        if (v === undefined || v === null || v === "" || (Array.isArray(v) && !v.length)) return;
        var dt = document.createElement("dt"); dt.textContent = FIELDS[k] || k;
        var dd = document.createElement("dd"); dd.textContent = pretty(k, v);
        dl.appendChild(dt); dl.appendChild(dd);
      });
      card.appendChild(dl);
      output.appendChild(card);
    });

    if (reply) {
      var p = document.createElement("p");
      p.className = "note";
      p.textContent = reply;
      output.appendChild(p);
    }
    actionRow.classList.remove("hidden");
  }

  /* ---------- api ---------- */
  function call(path, body) {
    return fetch(S.url + path, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + S.token },
      body: JSON.stringify(body)
    }).then(function (r) {
      return r.json().then(function (d) {
        if (!r.ok) throw new Error(d.error || ("Worker returned " + r.status));
        return d;
      });
    });
  }

  function interpret() {
    var text = transcript.value.trim();
    if (!text) return;
    hint.classList.add("hidden");
    micLabel.textContent = "Working it out";
    mic.disabled = true;

    call("/interpret", { transcript: text })
      .then(function (d) {
        if (!d.actions || !d.actions.length) {
          output.innerHTML = "";
          var p = document.createElement("p");
          p.className = "note";
          p.textContent = d.reply ||
            "Nothing in that looked like an event or a task. Add a time or a to-do and tap the mic again.";
          output.appendChild(p);
          return;
        }
        S.actions = d.actions;
        renderProposal(d.actions, d.reply);
      })
      .catch(function (e) { showError(e.message); })
      .finally(function () { mic.disabled = false; micLabel.textContent = "Hold a thought"; });
  }

  el("confirm").addEventListener("click", function () {
    if (!S.actions) return;
    el("confirm").disabled = true;
    el("confirm").textContent = "Creating";

    call("/execute", { actions: S.actions })
      .then(function (d) {
        output.innerHTML = "";
        d.results.forEach(function (r) {
          var row = document.createElement("div");
          row.className = "result";
          var mark = document.createElement("span");
          mark.className = r.ok ? "tick" : "cross";
          mark.textContent = r.ok ? "✓" : "✕";
          row.appendChild(mark);

          if (r.ok) {
            var span = document.createElement("span");
            span.textContent = (LABELS[r.tool] || r.tool) + ": ";
            if (r.url) {
              var a = document.createElement("a");
              a.href = r.url; a.target = "_blank"; a.rel = "noopener";
              a.textContent = r.label || "Open";
              span.appendChild(a);
            } else {
              span.appendChild(document.createTextNode(r.label || "Created"));
            }
            row.appendChild(span);
          } else {
            var err = document.createElement("span");
            err.textContent = (LABELS[r.tool] || r.tool) + " failed: " + r.error;
            row.appendChild(err);
          }
          output.appendChild(row);
        });
        transcript.value = ""; grow();
        S.actions = null;
        actionRow.classList.add("hidden");
      })
      .catch(function (e) { showError(e.message); })
      .finally(function () {
        el("confirm").disabled = false;
        el("confirm").textContent = "Create";
      });
  });

  el("discard").addEventListener("click", function () {
    transcript.value = ""; grow();
    clearOutput();
    hint.classList.remove("hidden");
    transcript.focus();
  });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
})();
</script>
</body>
</html>
